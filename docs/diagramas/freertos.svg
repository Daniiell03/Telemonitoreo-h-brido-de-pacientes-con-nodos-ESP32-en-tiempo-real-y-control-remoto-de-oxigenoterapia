<text x="1220.0" y="104.0" text-anchor="middle" font-size="12" font-weight="bold">ThingsBoard</text>
<text x="1220.0" y="120.0" text-anchor="middle" font-size="12">broker MQTT :1883</text>
<rect x="1130" y="205" width="300" height="190" rx="8" fill="#FFFFFF" stroke="#6B46C1" stroke-width="2.5" />
<path d="M1130,213 a8,8 0 0 1 8,-8 h284 a8,8 0 0 1 8,8 v18 h-300 z" fill="#6B46C1"/>
<text x="1280.0" y="223" text-anchor="middle" font-weight="bold" fill="white" font-size="14">Tarea C · Comunicaciones</text>
<text x="1142" y="251" font-size="12.5">Prioridad: 2  ·  fijada al núcleo 0</text>
<text x="1142" y="269" font-size="12.5">Publicación: cada 1000 ms  ·  Pila: 6144 B</text>
<text x="1142" y="287" font-size="12.5">q_telemetria → JSON → MQTT (QoS 1)</text>
<text x="1142" y="305" font-size="12.5">RPC recibido → q_comandos</text>
<text x="1142" y="323" font-size="12.5">Espera eg_red con timeout:</text>
<text x="1142" y="341" font-size="12.5">sin while(!connected)</text>
<rect x="1462" y="235" width="140" height="110" rx="8" fill="#FFFFFF" stroke="#6B46C1" stroke-width="1.5" />
<text x="1474" y="257" font-size="12.5" font-weight="bold">rb_offline</text>
<text x="1474" y="275" font-size="12.5">Buffer circular</text>
<text x="1474" y="293" font-size="12.5">300 muestras</text>
<text x="1474" y="311" font-size="12.5">(5 min a 1 Hz)</text>
<polygon points="1144,440 1326,440 1340,454 1340,506 1326,520 1144,520 1130,506 1130,454" fill="#E9D8FD" stroke="#6B46C1" stroke-width="1.5"/>
<text x="1235.0" y="469.0" text-anchor="middle" font-size="12" font-weight="bold">eg_red</text>
<text x="1235.0" y="485.0" text-anchor="middle" font-size="12">Event group</text>
<text x="1235.0" y="501.0" text-anchor="middle" font-size="12">WIFI_OK · MQTT_OK</text>
<rect x="1360" y="430" width="240" height="118" rx="8" fill="#EDF2F7" stroke="#A0AEC0" stroke-width="1.5" />
<text x="1372" y="452" font-size="12.5" font-weight="bold">Tareas del sistema (ESP-IDF)</text>
<text x="1372" y="470" font-size="12.5">wifi (23) · esp_event (20)</text>
<text x="1372" y="488" font-size="12.5">tcpip / lwIP (18)</text>
<text x="1372" y="506" font-size="12.5">mqtt_task (5) en núcleo 0</text>
<text x="1372" y="524" font-size="12.5">Reconexión por eventos</text>
<rect x="1130" y="700" width="460" height="170" rx="8" fill="#FFFFFF" stroke="#4A5568" stroke-width="2.5" />
<path d="M1130,708 a8,8 0 0 1 8,-8 h444 a8,8 0 0 1 8,8 v18 h-460 z" fill="#4A5568"/>
<text x="1360.0" y="718" text-anchor="middle" font-weight="bold" fill="white" font-size="14">Tarea E · Supervisor</text>
<text x="1142" y="746" font-size="12.5">Prioridad: 1  ·  fijada al núcleo 0</text>
<text x="1142" y="764" font-size="12.5">Periodo: 1000 ms  ·  Pila: 3072 B</text>
<text x="1142" y="782" font-size="12.5">Task Watchdog (5 s) suscrito por A, B y C</text>
<text x="1142" y="800" font-size="12.5">Heap libre y stack high-water de cada tarea</text>
<text x="1142" y="818" font-size="12.5">Contador de periodos perdidos de la tarea A</text>
<text x="1142" y="836" font-size="12.5">→ métricas en la telemetría (para el artículo)</text>
