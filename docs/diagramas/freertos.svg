 Nodo paciente (firmware común, ESP-IDF v5.5)</text>
<rect x="20" y="70" width="210" height="880" rx="14" fill="#F7FAFC" stroke="#718096" stroke-width="2"/>
<text x="125.0" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#718096">Periféricos</text>
<rect x="270" y="70" width="470" height="880" rx="14" fill="#EBF8FF" stroke="#2B6CB0" stroke-width="2"/>
<text x="505.0" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B6CB0">Núcleo 1 (APP_CPU) — tiempo real</text>
<rect x="1100" y="170" width="520" height="780" rx="14" fill="#FAF5FF" stroke="#6B46C1" stroke-width="2"/>
<text x="1420" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#6B46C1">Núcleo 0 (PRO_CPU) — red y supervisión</text>
<text x="920" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D3748">Comunicación entre tareas</text>
<rect x="40" y="130" width="170" height="72" rx="8" fill="#FEF3C7" stroke="#B7791F" stroke-width="1.5" />
<text x="52" y="152" font-size="12.5" font-weight="bold">Bus I2C · 400 kHz</text>
<text x="52" y="170" font-size="12.5">MAX30102 · MLX90614</text>
<text x="52" y="188" font-size="12.5">OLED SSD1306</text>
<rect x="40" y="345" width="170" height="72" rx="8" fill="#FEF3C7" stroke="#B7791F" stroke-width="1.5" />
<text x="52" y="367" font-size="12.5" font-weight="bold">ADC1 (nodo emulado)</text>
<text x="52" y="385" font-size="12.5">GPIO34 · 35 · 32</text>
<text x="52" y="403" font-size="12.5">atenuación 12 dB</text>
<polygon points="50,236 200,236 218,274.0 200,312 50,312 32,274.0" fill="#FEFCBF" stroke="#B7791F" stroke-width="1.5"/>
<text x="125.0" y="263.0" text-anchor="middle" font-size="12" font-weight="bold">mtx_i2c</text>
<text x="125.0" y="279.0" text-anchor="middle" font-size="12">Mutex · herencia</text>
<text x="125.0" y="295.0" text-anchor="middle" font-size="12">de prioridad</text>
<rect x="40" y="560" width="170" height="56" rx="8" fill="#E6F4EA" stroke="#2F855A" stroke-width="1.5" />
<text x="52" y="582" font-size="12.5" font-weight="bold">LEDC PWM 50 Hz</text>
<text x="52" y="600" font-size="12.5">GPIO18 → servo SG90</text>
<rect x="40" y="680" width="170" height="56" rx="8" fill="#E6F4EA" stroke="#2F855A" stroke-width="1.5" />
<text x="52" y="702" font-size="12.5" font-weight="bold">GPIO entrada</text>
<text x="52" y="720" font-size="12.5">GPIO19 ← final de carrera</text>
<rect x="300" y="110" width="410" height="178" rx="8" fill="#FFFFFF" stroke="#C53030" stroke-width="2.5" />
<path d="M300,118 a8,8 0 0 1 8,-8 h394 a8,8 0 0 1 8,8 v18 h-410 z" fill="#C53030"/>
<text x="505.0" y="128" text-anchor="middle" font-weight="bold" fill="white" font-size="14">Tarea A · Muestreo (crítica)</text>
<text x="312" y="156" font-size="12.5">Prioridad: 5  ·  fijada al núcleo 1</text>
<text x="312" y="174" font-size="12.5">Periodo: 20 ms con vTaskDelayUntil()</text>
<text x="312" y="192" font-size="12.5">Cómputo estimado: ≤ 2 ms  ·  Pila: 4096 B</text>
<text x="312" y="210" font-size="12.5">Lee sensores (I2C) o ADC1 (nodo emulado)</text>
<text x="312" y="228" font-size="12.5">Calcula FC, SpO₂ y T → publica a 1 Hz</text>
<text x="312" y="246" font-size="12.5">Marca de tiempo + GPIO23 para medir jitter</text>
<rect x="300" y="500" width="410" height="170" rx="8" fill="#FFFFFF" stroke="#DD6B20" stroke-width="2.5" />
<path d="M300,508 a8,8 0 0 1 8,-8 h394 a8,8 0 0 1 8,8 v18 h-410 z" fill="#DD6B20"/>
<text x="505.0" y="518" text-anchor="middle" font-weight="bold" fill="white" font-size="14">Tarea B · Control local</text>
<text x="312" y="546" font-size="12.5">Prioridad: 4  ·  fijada al núcleo 1</text>
<text x="312" y="564" font-size="12.5">Activación: comando RPC o cada 100 ms</text>
<text x="312" y="582" font-size="12.5">Cómputo estimado: ≤ 1 ms  ·  Pila: 3072 B</text>
<text x="312" y="600" font-size="12.5">SpO₂ &lt; umbral → abre válvula (aun sin red)</text>
<text x="312" y="618" font-size="12.5">Verifica estado real con final de carrera</text>
<rect x="300" y="750" width="410" height="170" rx="8" fill="#FFFFFF" stroke="#2C7A7B" stroke-width="2.5" />
<path d="M300,758 a8,8 0 0 1 8,-8 h394 a8,8 0 0 1 8,8 v18 h-410 z" fill="#2C7A7B"/>
<text x="505.0" y="768" text-anchor="middle" font-weight="bold" fill="white" font-size="14">Tarea D · Interfaz local</text>
<text x="312" y="796" font-size="12.5">Prioridad: 3  ·  fijada al núcleo 1</text>
<text x="312" y="814" font-size="12.5">Periodo: 500 ms  ·  Pila: 3072 B</text>
<text x="312" y="832" font-size="12.5">OLED por páginas: 8 × ~3 ms, libera</text>
<text x="312" y="850" font-size="12.5">mtx_i2c entre páginas → bloqueo de A acotado</text>
<text x="312" y="868" font-size="12.5">Nodo 2: resumen por log serie</text>
<rect x="790" y="150" width="260" height="72" rx="14" fill="#C6F6D5" stroke="#2F855A" stroke-width="1.5"/>
<text x="920.0" y="175.0" text-anchor="middle" font-size="12" font-weight="bold">q_telemetria</text>
<text x="920.0" y="191.0" text-anchor="middle" font-size="12">Cola · 20 × telemetria_t</text>
<text x="920.0" y="207.0" text-anchor="middle" font-size="12">xQueueSend(…, 0) — nunca bloquea a A</text>
<rect x="790" y="330" width="260" height="72" rx="14" fill="#C6F6D5" stroke="#2F855A" stroke-width="1.5"/>
<text x="920.0" y="355.0" text-anchor="middle" font-size="12" font-weight="bold">mb_vitales</text>
<text x="920.0" y="371.0" text-anchor="middle" font-size="12">Buzón (cola de longitud 1)</text>
<text x="920.0" y="387.0" text-anchor="middle" font-size="12">xQueueOverwrite / xQueuePeek</text>
<rect x="790" y="480" width="260" height="72" rx="14" fill="#FED7D7" stroke="#C53030" stroke-width="1.5"/>
<text x="920.0" y="505.0" text-anchor="middle" font-size="12" font-weight="bold">q_comandos</text>
<text x="920.0" y="521.0" text-anchor="middle" font-size="12">Cola · 5 × comando_t</text>
<text x="920.0" y="537.0" text-anchor="middle" font-size="12">setValvula · setUmbralSpO2</text>
<rect x="790" y="640" width="260" height="72" rx="14" fill="#C6F6D5" stroke="#2F855A" stroke-width="1.5"/>
<text x="920.0" y="665.0" text-anchor="middle" font-size="12" font-weight="bold">mb_actuador</text>
<text x="920.0" y="681.0" text-anchor="middle" font-size="12">Buzón (longitud 1)</text>
<text x="920.0" y="697.0" text-anchor="middle" font-size="12">comandada · estadoReal</text>
<path d="M1120,82 a100.0,10 0 0 1 200,0 v50 a100.0,10 0 0 1 -200,0 z" fill="#F3E8FF" stroke="#6B46C1" stroke-width="1.5"/>
